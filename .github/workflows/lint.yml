name: Lint and Format Check

on:
  push:
    branches: [ master, develop, feature/*, perf/* ]
  pull_request:
    branches: [ master, develop, feature/*, perf/* ]

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libflatpak-dev libssl-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev libegl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      - name: Run clippy
        run: cargo clippy --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Build application
        run: cargo build --locked

      - name: Install X11 smoke-test tools
        run: sudo apt-get install -y xvfb x11-utils imagemagick dbus-x11 mesa-vulkan-drivers libgl1-mesa-dri

      - name: Start store on X11 and capture screenshot
        env:
          LANG: en_US.UTF-8
          WINIT_UNIX_BACKEND: x11
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' bash scripts/smoke-x11.sh

      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-x11-smoke
          path: smoke-artifacts/
          if-no-files-found: ignore
