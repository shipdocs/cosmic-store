name: Lint and Format Check

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop, feature/*, perf/* ]

concurrency:
  group: store-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Install native and X11 test dependencies
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb x11-utils xdotool imagemagick dbus-x11 mesa-vulkan-drivers libgl1-mesa-dri build-essential dpkg-dev desktop-file-utils pkg-config apt-config-icons apt-config-icons-hidpi apt-config-icons-large apt-config-icons-large-hidpi adwaita-icon-theme libflatpak-dev libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libegl1-mesa-dev
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-git-
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-target-
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      - name: Run clippy
        run: cargo clippy --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Build application
        run: cargo build --locked

      - name: Package and install Kompas preview
        run: |
          bash scripts/package-preview.sh
          sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=2 install -y ./dist/*.deb
          dpkg-query -W cosmic-store
          desktop-file-validate /usr/share/applications/com.system76.CosmicStore.desktop

      - name: Upload installable preview
        uses: actions/upload-artifact@v4
        with:
          name: kompas-zorin-preview-amd64
          path: dist/
          retention-days: 30

      - name: Start store on X11 and capture screenshot
        timeout-minutes: 3
        env:
          LANG: en_US.UTF-8
          WINIT_UNIX_BACKEND: x11
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' bash scripts/smoke-x11.sh /usr/bin/cosmic-store

      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-x11-smoke
          path: smoke-artifacts/
          if-no-files-found: ignore
